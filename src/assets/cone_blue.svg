<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <title>Blue clipart soccer cone</title>
  <defs>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#42A5F5"/>
      <stop offset="55%" stop-color="#1E88E5"/>
      <stop offset="100%" stop-color="#1565C0"/>
    </linearGradient>
    <radialGradient id="softHighlight" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#000000" flood-opacity="0.16"/>
    </filter>
  </defs>

  <g filter="url(#softShadow)">
    <!-- main cone body -->
    <path d="M455 160
             C445 160 436 165 429 173
             L35 614
             C10 642 25 679 61 692
             C202 744 425 765 600 765
             C775 765 998 744 1139 692
             C1175 679 1190 642 1165 614
             L771 173
             C764 165 755 160 745 160
             Z"
          fill="url(#bodyGrad)"/>

    <!-- subtle top bevel -->
    <path d="M455 160 L745 160 C755 160 764 165 771 173 L802 208
             C744 198 663 193 600 193
             C537 193 456 198 398 208
             L429 173 C436 165 445 160 455 160 Z"
          fill="#ffffff" opacity="0.10"/>

    <!-- soft body highlight -->
    <path d="M75 620 L435 215 C525 190 675 190 765 215 L1125 620
             C1020 680 805 712 600 712 C395 712 180 680 75 620 Z"
          fill="url(#softHighlight)"/>

    <!-- lower rim band -->
    <path d="M114 585
             C235 646 420 677 600 677
             C780 677 965 646 1086 585"
          fill="none" stroke="#1565C0" stroke-width="26" stroke-linecap="round" opacity="0.38"/>

    <!-- middle contour band -->
    <path d="M222 455
             C318 505 459 531 600 531
             C741 531 882 505 978 455"
          fill="none" stroke="#1565C0" stroke-width="20" stroke-linecap="round" opacity="0.26"/>

    <!-- outer edge definition -->
    <path d="M455 160
             C445 160 436 165 429 173
             L35 614
             C10 642 25 679 61 692
             C202 744 425 765 600 765
             C775 765 998 744 1139 692
             C1175 679 1190 642 1165 614
             L771 173
             C764 165 755 160 745 160
             Z"
          fill="none" stroke="#1565C0" stroke-width="18" opacity="0.55" stroke-linejoin="round"/>
  </g>
</svg>
