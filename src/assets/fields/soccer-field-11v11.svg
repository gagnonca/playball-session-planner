<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc">
  <title id="title">11v11 soccer field</title>
  <desc id="desc">A proportional 115 by 70 yard 11v11 field with a transparent surface (the canvas draws the grass).</desc>
  <defs>
    <clipPath id="pitchClip"><rect x="40" y="40" width="920" height="560"/></clipPath>
    <clipPath id="leftPenaltyArc"><rect x="184" y="220" width="45" height="200"/></clipPath>
    <clipPath id="rightPenaltyArc"><rect x="770" y="220" width="46" height="200"/></clipPath>
  </defs>

  <g clip-path="url(#pitchClip)" fill="none" stroke="#FFFFFF" stroke-width="4" opacity="0.7" stroke-linecap="round" stroke-linejoin="round">
    <rect x="40" y="40" width="920" height="560" stroke-width="8"/>
    <path d="M500 40V600"/>

    <!-- 18-yard-deep, 44-yard-wide penalty areas -->
    <path d="M40 144H184V496H40 M960 144H816V496H960"/>
    <!-- 6-yard-deep, 20-yard-wide goal areas -->
    <path d="M40 240H88V400H40 M960 240H912V400H960"/>

    <circle cx="500" cy="320" r="80"/>
    <circle cx="136" cy="320" r="80" clip-path="url(#leftPenaltyArc)"/>
    <circle cx="864" cy="320" r="80" clip-path="url(#rightPenaltyArc)"/>

    <!-- One-yard corner arcs -->
    <path d="M40 48A8 8 0 0 0 48 40 M952 40A8 8 0 0 0 960 48
             M40 592A8 8 0 0 1 48 600 M952 600A8 8 0 0 1 960 592"/>

  </g>

  <g fill="#FFFFFF" opacity="0.75">
    <circle cx="500" cy="320" r="4"/>
    <circle cx="136" cy="320" r="4"/>
    <circle cx="864" cy="320" r="4"/>
  </g>
</svg>
