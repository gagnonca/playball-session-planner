<svg xmlns="http://www.w3.org/2000/svg" width="680" height="480" viewBox="0 0 680 480" role="img" aria-labelledby="title desc">
  <title id="title">4v4 soccer field</title>
  <desc id="desc">A proportional 30 by 20 yard 4v4 field with a transparent surface (the canvas draws the grass).</desc>
  <defs>
    <clipPath id="pitchClip"><rect x="40" y="40" width="600" height="400"/></clipPath>
  </defs>

  <g clip-path="url(#pitchClip)" fill="none" stroke="#FFFFFF" stroke-width="4" opacity="0.7" stroke-linecap="round" stroke-linejoin="round">
    <rect x="40" y="40" width="600" height="400" stroke-width="8"/>
    <path d="M340 40V440"/>
  </g>

  <g fill="#FFFFFF" opacity="0.75">
    <circle cx="340" cy="240" r="4"/>
  </g>
</svg>
