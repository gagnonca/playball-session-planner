<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">7v7 and larger soccer goal viewed from overhead</title>
  <desc id="desc">A wide rigid 21 by 7 foot soccer goal with heavy white frame and visible net mesh.</desc>
  <defs>
    <filter id="shadow" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#142019" flood-opacity="0.24"/>
    </filter>
    <clipPath id="netArea">
      <path d="M90 350 L1110 350 L1070 130 L130 130 Z"/>
    </clipPath>
  </defs>

  <path d="M90 350 L1110 350 L1070 130 L130 130 Z"
        fill="#E4E9E3" fill-opacity="0.08"/>

  <g clip-path="url(#netArea)" fill="none" stroke="#E4E9E3" stroke-width="16"
     stroke-linecap="round" opacity="0.8">
    <path d="M100 306 H1100 M109 262 H1091 M117 218 H1083 M125 174 H1075"/>
    <path d="M205 350 L222 130 M320 350 L333 130 M435 350 L444 130
             M550 350 L555 130 M665 350 L666 130 M780 350 L777 130
             M895 350 L888 130 M1010 350 L999 130"/>
  </g>

  <g fill="none" stroke="#F0F3EF" stroke-width="60" stroke-linecap="round"
     stroke-linejoin="round" filter="url(#shadow)">
    <path d="M90 350 L130 130 H1070 L1110 350"/>
    <path d="M90 350 H1110"/>
  </g>

  <circle cx="90" cy="350" r="30" fill="#F7F9F6"/>
  <circle cx="1110" cy="350" r="30" fill="#F7F9F6"/>
</svg>
