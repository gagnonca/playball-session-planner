<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480">
  <defs>
    <filter id="shadow" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#142019" flood-opacity="0.24"/>
    </filter>
    <clipPath id="netArea">
      <path d="M104 350 C145 120 855 120 896 350 Z"/>
    </clipPath>
  </defs>

  <!-- Wider rounded pop-up net bed -->
  <path d="M104 350 C145 120 855 120 896 350 Z"
        fill="#E4E9E3" fill-opacity="0.08"/>

  <!-- Curved mesh follows the characteristic PUGG-style bow -->
  <g clip-path="url(#netArea)" fill="none" stroke="#E4E9E3" stroke-width="16"
     stroke-linecap="round" opacity="0.8">
    <path d="M122 300 C176 151 824 151 878 300"/>
    <path d="M140 250 C208 172 792 172 860 250"/>
    <path d="M160 202 C244 181 756 181 840 202"/>
    <path d="M104 350 L230 160 M220 350 L320 140 M336 350 L405 128
             M452 350 L470 124 M548 350 L530 124 M664 350 L595 128
             M780 350 L680 140 M896 350 L770 160"/>
  </g>

  <!-- Flexible bowed frame and flat mouth, seen at exactly 90 degrees -->
  <g fill="none" stroke="#F0F3EF" stroke-width="60" stroke-linecap="round"
     stroke-linejoin="round" filter="url(#shadow)">
    <path d="M104 350 C145 120 855 120 896 350"/>
    <path d="M104 350 H896"/>
  </g>

  <circle cx="104" cy="350" r="30" fill="#F7F9F6"/>
  <circle cx="896" cy="350" r="30" fill="#F7F9F6"/>
</svg>
