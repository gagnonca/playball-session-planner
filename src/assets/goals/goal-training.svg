<svg xmlns="http://www.w3.org/2000/svg" width="700" height="460" viewBox="0 0 700 460" role="img" aria-labelledby="title desc">
  <title id="title">4v4 soccer goal viewed from overhead</title>
  <desc id="desc">A compact rigid 6 by 4 foot soccer goal with heavy white frame and visible net mesh.</desc>
  <defs>
    <filter id="shadow" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#142019" flood-opacity="0.24"/>
    </filter>
    <clipPath id="netArea">
      <path d="M95 340 L605 340 L545 145 L155 145 Z"/>
    </clipPath>
  </defs>

  <path d="M95 340 L605 340 L545 145 L155 145 Z"
        fill="#E4E9E3" fill-opacity="0.08"/>

  <g clip-path="url(#netArea)" fill="none" stroke="#E4E9E3" stroke-width="16"
     stroke-linecap="round" opacity="0.8">
    <path d="M110 292 H590 M125 244 H575 M140 196 H560"/>
    <path d="M190 340 L226 145 M280 340 L298 145 M370 340 L368 145
             M460 340 L438 145 M550 340 L508 145"/>
  </g>

  <g fill="none" stroke="#F0F3EF" stroke-width="60" stroke-linecap="round"
     stroke-linejoin="round" filter="url(#shadow)">
    <path d="M95 340 L155 145 H545 L605 340"/>
    <path d="M95 340 H605"/>
  </g>

  <circle cx="95" cy="340" r="30" fill="#F7F9F6"/>
  <circle cx="605" cy="340" r="30" fill="#F7F9F6"/>
</svg>
