<svg xmlns="http://www.w3.org/2000/svg" width="700" height="460" viewBox="0 0 700 460">
  <defs>
    <filter id="shadow" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#142019" flood-opacity="0.24"/>
    </filter>
    <clipPath id="netArea">
      <path d="M104 336 C136 128 564 128 596 336 Z"/>
    </clipPath>
  </defs>

  <!-- Rounded pop-up net bed -->
  <path d="M104 336 C136 128 564 128 596 336 Z"
        fill="#E4E9E3" fill-opacity="0.08"/>

  <!-- Curved mesh follows the characteristic PUGG-style bow -->
  <g clip-path="url(#netArea)" fill="none" stroke="#E4E9E3" stroke-width="16"
     stroke-linecap="round" opacity="0.8">
    <path d="M119 288 C161 158 539 158 581 288"/>
    <path d="M135 240 C188 179 512 179 565 240"/>
    <path d="M151 196 C216 188 484 188 549 196"/>
    <path d="M104 336 L208 166 M202 336 L276 150 M300 336 L326 142
             M400 336 L374 142 M498 336 L424 150 M596 336 L492 166"/>
  </g>

  <!-- Flexible bowed frame and flat mouth, seen at exactly 90 degrees -->
  <g fill="none" stroke="#F0F3EF" stroke-width="60" stroke-linecap="round"
     stroke-linejoin="round" filter="url(#shadow)">
    <path d="M104 336 C136 128 564 128 596 336"/>
    <path d="M104 336 H596"/>
  </g>

  <circle cx="104" cy="336" r="30" fill="#F7F9F6"/>
  <circle cx="596" cy="336" r="30" fill="#F7F9F6"/>
</svg>
